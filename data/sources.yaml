# VoltQuery source registry.
#
# License metadata is data, not documentation. Every source must carry a
# machine-readable license/provenance block. A source is only promoted to
# status: approved after the exact license of the specific file/version in use
# has been independently verified and recorded (verification_url / verified_at /
# verification_note). Unknown data_policy is treated as restrictive.

