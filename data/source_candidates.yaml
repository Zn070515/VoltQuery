# VoltQuery source-candidate registry (acquisition-side).
#
# This is the *discovery* output: sources the crawler surfaced or that were
# proposed, BEFORE the license/policy gate has adjudicated them. A candidate is
# promoted to data/sources.yaml (status: approved) only after the exact license of
# the specific file/version in use has been independently verified and recorded
# (verification_url / verified_at / verification_note). Never assume a discovered
# URL implies a license.
#
# This file is deliberately NOT a frozen cross-module contract. It is an ingest
# registry for source discovery. When the acquisition pipeline becomes its own
# component, this shape should move behind a typed model.
#
# Candidate lifecycle (`status`, top level):
#   discovered            surfaced but not yet license-verified
#   verified              license claim independently confirmed at the artifact level
#   promoted              verified acceptable; registered in data/sources.yaml
#   rejected              verified NOT acceptable under the target policy
#   license_review        conflicting / version-dependent license evidence; adjudicate before promote/reject
# `reason` (rejected-only) records why; `promoted_source_id` (promoted-only)
# records the data/sources.yaml id it was registered under.
# `license_claim.status` tracks the *claim* resolution specifically:
# pending_verification / verified / rejected — i.e. did the requested license (e.g.
# CC-BY-4.0) actually hold on the artifact.

candidates:
  - id: ksu-engineering-electronics
    domain: [analog_electronics]
    discovered_url: https://alg.manifoldapp.org/projects/laboratory-manual-for-engineering-electronics
    license_claim:
      id: CC-BY-4.0
      status: pending_verification
    acquisition:
      type: web
      requires_auth: false
    policy:
      target: public_redistributable
    status: license_review
    reason: version_license_metadata_conflict
    priority: A
    notes: >-
      Laboratory Manual for Engineering Electronics (Kennesaw State / OpenALG).
      Fills the Analog probe: diode, BJT, MOSFET, op-amp, pre-lab, LTspice,
      handouts, datasheets. VERIFIED 2026-08-22 originally: the GALILEO OLM
      record (Das, Thain, Hill, 2019; Engineering Open Textbooks 2, citation
      oer.galileo.usg.edu/engineering-textbooks/2) listed
      "Attribution-NonCommercial" (CC BY-NC) -> rejected as noncommercial.
      RE-CHECKED 2026-08-22 (version: current live pages): BOTH the OpenALG
      project page (alg.manifoldapp.org/projects/laboratory-manual-for-engineering-electronics)
      AND the current GALILEO /2 record (EE 3401, Summer 2019) now declare
      "Creative Commons Attribution 4.0 International License" (CC BY 4.0).
      This is a genuine version/date conflict with the earlier BY-NC reading —
      either the work was re-licensed or the earlier NC note was a stale/different
      record. Under the strict "never assume the permissive side" rule, do NOT
      promote to approved on the page claim alone. STATUS: license_review. To
      promote: download the exact lab-manual artifact, confirm its printed/licensed
      version (auth + date + license), then record the artifact-level license. A
      faithful analog probe source (diode/BJT/MOSFET/op-amp) if confirmed.

  - id: fiore-semiconductor-lab
    domain: [analog_electronics]
    discovered_url: https://pressbooks.atlanticoer-relatlantique.ca/semiconductorlab/
    license_claim:
      id: CC-BY-4.0
      status: rejected
    acquisition:
      type: web
      requires_auth: false
    policy:
      target: public_redistributable
    status: rejected
    reason: noncommercial
    priority: A
    notes: >-
      Fiore, Semiconductor Devices: Theory and Application Lab Manual. Verified
      2026-08-22: the author's own MVCC "Free Books" page
      (www2.mvcc.edu/users/faculty/jfiore/freebooks.html) licenses this title as
      copyright-by-author under CC BY-NC-SA 3.0; the pressbooks author note
      ("A Note from the Author") likewise says non-commercial share-alike. Only a
      pressbooks catalog metadata row says "CC BY", which conflicts. Per the
      conflict rule (never assume the permissive side) this is CC BY-NC-SA → NOT
      public_redistributable → REJECTED under the public policy. The per-work trap
      is confirmed: this family is not a CC-BY public source.

