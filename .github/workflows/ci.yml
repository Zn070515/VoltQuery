name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache: uv
      - name: Install dependencies (locked)
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Validate real registry and corpus
        run: uv run voltquery validate
      - name: Enforce public-Gold source policy
        run: uv run voltquery policy public-gold
      - name: Check M0 seed-corpus + benchmark gate
        run: uv run voltquery milestone m0
