[project]
name = "voltquery"
version = "0.0.1"
description = "VoltQuery - Electrical Engineering Problem Search & Verifiable Reasoning Engine"
readme = "README.md"
authors = [
    { name = "Zn070515", email = "302025510036@zjut.edu.cn" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
document = [
    "pymupdf>=1.24,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0.12.20260815",
    "pymupdf>=1.24,<2",
]

[project.scripts]
voltquery = "voltquery.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/voltquery"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
